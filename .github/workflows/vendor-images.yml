name: Vendor images

# Downloads the brands' food photos + logos on a GitHub runner (which has
# open internet access) and commits them into public/, so the site serves
# them from the repo itself — no expiring Instagram links, no Cloudinary yet.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/vendor-images.mjs"
      - ".github/workflows/vendor-images.yml"

permissions:
  contents: write

concurrency:
  group: vendor-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download images
        run: node scripts/vendor-images.mjs

      - name: Commit vendored images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/
          if git diff --cached --quiet; then
            echo "No image changes to commit."
          else
            git commit -m "chore: vendor food photos and brand logos into public/"
            git push
          fi
